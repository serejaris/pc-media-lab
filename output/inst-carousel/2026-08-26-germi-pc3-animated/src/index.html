<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1080px;background:#0e0f13;color:#f5f2ea;font-family:"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:90px;position:relative;overflow:hidden}
.tag{font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:#ffcc4d;margin-bottom:38px}
h1{font-size:88px;line-height:1.04;margin-bottom:34px;position:relative;z-index:2}
.sub{font-size:40px;line-height:1.35;color:#b9b4a6;max-width:820px}
.meta{position:absolute;left:90px;right:90px;bottom:80px;display:flex;justify-content:space-between;align-items:center;border-top:3px solid #26272e;padding-top:36px;z-index:2}
.when{font-size:42px;font-weight:700;color:#ffcc4d}
.host{font-size:32px;color:#b9b4a6}
.blob,.blob2{position:absolute;border-radius:50%;will-change:transform}
.blob{top:-140px;right:-140px;width:420px;height:420px;background:#1c2a4a}
.blob2{bottom:-160px;left:-120px;width:380px;height:380px;background:#23306b}
.sweep{position:absolute;left:90px;top:505px;width:900px;height:6px;background:linear-gradient(90deg,#ffcc4d,#ff8a3d);transform-origin:left;z-index:1}
</style></head>
<body><div class="slide">
<div class="blob" id="blob"></div><div class="blob2" id="blob2"></div>
<div class="tag">Personal Corp · Поток 3 · Урок 1</div>
<h1 id="title">Главный отдел:<br>папка, контекст и правила</h1>
<div class="sweep" id="sweep"></div>
<p class="sub">Собираем штаб своей личной корпорации: структура папки, контекст и правила для агентов.</p>
<div class="meta"><span class="when">вт 15.09 · 19:00 МСК</span><span class="host">ведёт Серёжа Рис · ссылка в посте ниже</span></div>
</div>
<script>
const P = 2*Math.PI;
function setT(t){
  const cyc = t => t % 1;
  const c1 = cyc(t), c2 = cyc(t + 0.5), sw = cyc(1.7*t);
  document.getElementById('blob').style.transform =
    `translate(${Math.cos(c1*P)*26}px, ${28*Math.sin(c1*P)}px) scale(${1+0.05*Math.sin(c1*P)})`;
  document.getElementById('blob2').style.transform =
    `translate(${22*Math.sin(c2*P)}px, ${20*Math.cos(c2*P)}px)`;
  const s = document.getElementById('sweep');
  s.style.transform = `scaleX(${0.25+0.75*(0.5-0.5*Math.cos(sw*P))})`;
  s.style.opacity = 0.55+0.45*Math.sin(sw*P);
}
window.setT = setT; setT(0);
</script></body></html>
