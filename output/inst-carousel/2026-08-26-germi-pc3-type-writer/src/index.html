<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1080px;background:#0e0f13;color:#f5f2ea;font-family:"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:90px;position:relative;overflow:hidden}
.tag{font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:#ffcc4d;margin-bottom:38px}
h1{font-size:84px;line-height:1.06;margin-bottom:30px;min-height:380px;white-space:pre-wrap}
.caret{display:inline-block;width:10px;height:78px;background:#ffcc4d;vertical-align:-8px;border-radius:3px;margin-left:6px}
.sub{font-size:38px;line-height:1.35;color:#b9b4a6;max-width:820px;opacity:0}
.meta{margin-top:52px;display:flex;justify-content:space-between;align-items:center;border-top:3px solid #26272e;padding-top:36px;opacity:0;gap:40px}
.when{font-size:42px;font-weight:700;color:#ffcc4d}
.host{font-size:32px;color:#b9b4a6}
.blob,.blob2{position:absolute;border-radius:50%;will-change:transform;z-index:0}
.blob{top:-140px;right:-140px;width:420px;height:420px;background:#1c2a4a}
.blob2{bottom:-160px;left:-120px;width:380px;height:380px;background:#23306b}
.tag,.h1wrap,.sub,.meta{position:relative;z-index:1}
</style></head>
<body><div class="slide">
<div class="blob" id="blob"></div><div class="blob2" id="blob2"></div>
<div class="tag">Personal Corp · Поток 3 · Урок 1</div>
<div class="h1wrap"><h1><span id="typed"></span><span class="caret" id="caret"></span></h1></div>
<p class="sub" id="sub">Собираем штаб своей личной корпорации.</p>
<div class="meta" id="meta"><span class="when">вт 15.09 · 19:00 МСК</span><span class="host">ведёт Серёжа Рис · ссылка в посте ниже</span></div>
</div>
<script>
const DUR_MS = 4800;
const TEXT = "Главный отдел:\nпапка,\nконтекст\nи правила";
// seeded PRNG (mulberry32), фиксированный сид -> детерминированный ритм
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20040915);
// кумулятивные времена появления символов: базовый ритм + паузы после знаков
let acc = 250; const charTimes = [];
for (const ch of TEXT){
  let d = 42 + rnd()*46;
  if (".:,".includes(ch)) d += 240;
  if (ch === "\n") d += 160;
  if (ch === " ") d *= 0.55;
  acc += d; charTimes.push(acc);
}
const TYPE_END = acc + 120;
const BLINK = 530; // мс период каретки; после набора мигаем целым числом циклов до конца лупа
function easeOutExpo(u){ return u>=1 ? 1 : 1 - Math.pow(2, -10*u); }
function setT(t){
  const ms = t * DUR_MS;
  // бинарный поиск видимого префикса
  let lo=0, hi=charTimes.length;
  while (lo<hi){ const mid=(lo+hi)>>1; charTimes[mid]<=ms ? lo=mid+1 : hi=mid; }
  document.getElementById('typed').textContent = TEXT.slice(0, lo);
  const caret = document.getElementById('caret');
  caret.style.opacity = (ms > TYPE_END)
    ? (Math.floor((ms-TYPE_END)/BLINK)%2 === 0 ? 1 : 0)
    : 1;
  const uS = Math.min(1, Math.max(0,(ms-TYPE_END-100)/650));
  const sub = document.getElementById('sub');
  sub.style.opacity = easeOutExpo(uS);
  sub.style.transform = `translateY(${28*(1-easeOutExpo(uS))}px)`;
  const uM = Math.min(1, Math.max(0,(ms-TYPE_END-300)/700));
  const meta = document.getElementById('meta');
  meta.style.opacity = easeOutExpo(uM);
  meta.style.transform = `translateY(${34*(1-easeOutExpo(uM))}px)`;
  const P=2*Math.PI, c1=t, c2=(t+0.5)%1;
  document.getElementById('blob').style.transform =
    `translate(${Math.cos(c1*P)*26}px, ${28*Math.sin(c1*P)}px) scale(${1+0.05*Math.sin(c1*P)})`;
  document.getElementById('blob2').style.transform =
    `translate(${22*Math.sin(c2*P)}px, ${20*Math.cos(c2*P)}px)`;
}
window.setT = setT; setT(0);
</script></body></html>
